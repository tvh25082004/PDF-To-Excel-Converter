services:
  - type: web
    name: pdf-to-excel-converter
    env: python
    plan: free
    region: singapore
    buildCommand: |
      apt-get update && apt-get install -y default-jre || true
      pip install --upgrade pip
      pip install -r ConverterApp/requirements.txt
    startCommand: cd ConverterApp && gunicorn pdftoexcel:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: RENDER
        value: "1"
    healthCheckPath: /

